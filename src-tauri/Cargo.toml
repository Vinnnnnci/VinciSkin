[package]
name = "vinciskin"
version = "1.23.0"
description = "VinciSkin - Desktop app for managing League of Legends mods"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }
fs-err = { workspace = true }

[dependencies]
tauri = { version = "2", features = [
    "protocol-asset",
    "devtools",
    "tray-icon",
] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"

hexshade = { workspace = true }
vinciskin-core = { path = "../crates/vinciskin-core", features = ["ts"] }
vinciskin-game = { path = "../crates/vinciskin-game", features = ["ts"] }

ltk_mod_core = { version = "0.1.1" }
ltk_overlay = { workspace = true }
ltk_file = { workspace = true }
ltk_hash = { workspace = true }

serde_yaml_ng = { workspace = true }
semver = { workspace = true }
toml = "0.8"
indexmap = { workspace = true }
parking_lot = { workspace = true }

tokio = { version = "1", features = ["full"] }

serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
base64 = { workspace = true }

ts-rs = { workspace = true, features = [
    "chrono-impl",
    "serde-json-impl",
    "indexmap-impl",
] }

specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

thiserror = { workspace = true }
anyhow = "1"

uuid = { workspace = true }
chrono = { workspace = true }
byteorder = "1.5.0"
zstd = { version = "0.13", default-features = false }

zip = { workspace = true }
image = { workspace = true }
notify = { version = "7", default-features = false }
notify-debouncer-mini = "0.5"
fs-err = { workspace = true }
walkdir = { workspace = true }

reqwest = { workspace = true }
url = "2"
flate2 = { workspace = true }
tar = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_matches = { workspace = true }
filetime = "0.2"
tempfile = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
